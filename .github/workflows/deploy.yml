name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX models from Release
        uses: robinraju/release-downloader@v1.8
        with:
          repository: phona/pytoya-ocr
          tag: v1.0
          fileName: "*.onnx"
          out-file-path: pytoya-ocr/service/models/

      - name: Arrange model files
        run: |
          mkdir -p pytoya-ocr/service/models/det_v4/onnx pytoya-ocr/service/models/rec_v8/onnx
          mv pytoya-ocr/service/models/det_v4.onnx pytoya-ocr/service/models/det_v4/onnx/model.onnx
          mv pytoya-ocr/service/models/rec_v8.onnx pytoya-ocr/service/models/rec_v8/onnx/model.onnx

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          cd pytoya-ocr/service
          docker build -t ghcr.io/${{ github.repository }}/ocr-service:latest .
          docker push ghcr.io/${{ github.repository }}/ocr-service:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        timeout-minutes: 30
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/ocr-service
            docker compose pull
            docker compose up -d
            sleep 5
            curl -sf http://localhost:8090/health || exit 1
