name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX models from Release
        uses: robinraju/release-downloader@v1.8
        with:
          repository: phona/pytoya-ocr
          tag: v1.0
          fileName: "*.onnx"
          out-file-path: pytoya-ocr/service/models/

      - name: Arrange model files
        run: |
          mkdir -p pytoya-ocr/service/models/det_v4/onnx pytoya-ocr/service/models/rec_v8/onnx
          mv pytoya-ocr/service/models/det_v4.onnx pytoya-ocr/service/models/det_v4/onnx/model.onnx
          mv pytoya-ocr/service/models/rec_v8.onnx pytoya-ocr/service/models/rec_v8/onnx/model.onnx

      - name: Upload source and models to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: pytoya-ocr/service/
          target: /root/ocr-build/

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/ocr-build/pytoya-ocr/service
            docker build -t ocr-service:latest .
            cd /root/ocr-service
            docker compose up -d
            sleep 5
            curl -sf http://localhost:8090/health || exit 1
